name: FPL AI Automated Pipeline

on:
  # Allows you to click a button to run it manually on GitHub
  workflow_dispatch: 
  
  # Runs automatically at 2:00 AM UTC every Friday
  schedule:
    - cron: '0 2 * * 5'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Ingestion
        run: python ingestion.py

      - name: Train AI Model
        run: python model.py

      - name: Generate Predictions
        run: python predict.py

      - name: Commit Updated Data & Model
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Data & Model Update"
          file_pattern: "*.csv *.pkl"