name: FPL AI Automated Pipeline

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 2 * * 5'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Upgraded checkout action to v4 to clear the Node 20 deprecation warning
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Ingestion
        run: cd fpl_ai_backend && python ingestion.py

      - name: Train AI Model
        run: cd fpl_ai_backend && python model.py

      - name: Generate Predictions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd fpl_ai_backend && python predict.py

      # Added fpl_predictions.csv to the file_pattern array
      - name: Commit Updated Data & Model
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Data & Model Update"
          file_pattern: "fpl_ai_backend/*.csv fpl_ai_backend/*.pkl fpl_ai_backend/fpl_predictions.csv"